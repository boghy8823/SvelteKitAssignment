name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Hooks are a local developer aid; CI runs the same checks as explicit jobs.
  HUSKY: '0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  component:
    name: Component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Its own job so the browser download does not slow the pure-logic gate.
      # No --with-deps: the runner image already ships Chromium's shared
      # libraries, and the apt install it triggers hung for 15 minutes before
      # being cancelled. Downloading the browser alone takes seconds.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:component

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Both adapters are built: the deploy target and the target every other
      # gate runs against. Either one rotting is a build failure, not a surprise
      # at deploy time.
      - run: pnpm build
      - run: pnpm build:node
      # The Node output is what Playwright and Lighthouse serve. Uploading it
      # keeps those jobs from rebuilding the same tree.
      - uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: build
          retention-days: 1

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: node-build
          path: build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
        env:
          AUTH_SECRET: ci-e2e-secret
          E2E_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: node-build
          path: build
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: pnpm lighthouse
        env:
          AUTH_SECRET: ci-lighthouse-secret
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
