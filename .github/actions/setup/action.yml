name: Setup
description: Install pnpm and Node, then install dependencies from the lockfile.

runs:
  using: composite
  steps:
    # No version input: the pinned `packageManager` field is the single source of truth.
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
